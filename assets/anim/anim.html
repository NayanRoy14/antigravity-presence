<!doctype html>
<!-- One frame of an Antigravity status animation: anim.html?state=work&t=0.25
     Everything is a pure function of t in [0,1) so the loop is seamless. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #17181c; }
  #stage { position: relative; width: 512px; height: 512px; overflow: hidden; background: radial-gradient(circle at 50% 42%, #23252c 0%, #17181c 70%); }
  #logo { position: absolute; left: 50%; top: 50%; width: 270px; height: 253px; margin: -126px 0 0 -135px; transform-origin: 50% 60%; }
  svg.fx { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="stage">
  <svg class="fx" id="back" width="512" height="512"></svg>
  <img id="logo" src="mark.svg">
  <svg class="fx" id="front" width="512" height="512"></svg>
</div>
<script>
const q = new URLSearchParams(location.search);
const state = q.get('state') || 'float';
const t = parseFloat(q.get('t') || '0');
const TAU = Math.PI * 2;
const logo = document.getElementById('logo');
const back = document.getElementById('back');
const front = document.getElementById('front');
const NS = 'http://www.w3.org/2000/svg';
const GRAD = '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4b400"/><stop offset=".35" stop-color="#ea4335"/><stop offset=".7" stop-color="#4285f4"/><stop offset="1" stop-color="#34a853"/></linearGradient></defs>';
back.innerHTML = front.innerHTML = GRAD;
function add(svg, tag, attrs, text) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (text) el.textContent = text;
  svg.appendChild(el);
  return el;
}
function place(dy, scale = 1, rot = 0, opacity = 1) {
  logo.style.transform = `translateY(${dy}px) rotate(${rot}deg) scale(${scale})`;
  logo.style.opacity = opacity;
}
function shadow(lift, y = 420) {
  // Ground shadow shrinks as the logo rises.
  const k = 1 - lift / 90;
  add(back, 'ellipse', { cx: 256, cy: y, rx: 110 * k, ry: 14 * k, fill: '#000', opacity: 0.45 * k });
}

if (state === 'float') {
  // Viewing: a calm anti-gravity hover.
  const lift = 30 + 18 * Math.sin(TAU * t);
  place(-lift + 10);
  shadow(lift);
}

if (state === 'work') {
  // Agent working: brisk hover inside a spinning gradient ring with orbiting sparks.
  const lift = 26 + 8 * Math.sin(TAU * 2 * t);
  place(-lift + 6, 0.82);
  shadow(lift, 430);
  const a = 360 * t;
  add(front, 'circle', { cx: 256, cy: 236, r: 200, fill: 'none', stroke: 'url(#g)', 'stroke-width': 10, 'stroke-linecap': 'round', 'stroke-dasharray': '420 837', transform: `rotate(${a} 256 236)`, opacity: 0.95 });
  add(front, 'circle', { cx: 256, cy: 236, r: 200, fill: 'none', stroke: '#4285f4', 'stroke-width': 4, 'stroke-dasharray': '90 1167', transform: `rotate(${a * 2 + 180} 256 236)`, opacity: 0.6 });
  for (let i = 0; i < 3; i++) {
    const ang = TAU * (t + i / 3);
    add(front, 'circle', { cx: 256 + 222 * Math.cos(ang), cy: 236 + 222 * Math.sin(ang), r: 9, fill: ['#f4b400', '#ea4335', '#34a853'][i] });
  }
}

if (state === 'think') {
  // Agent thinking: slow hover, a thought bubble with three dots pulsing in turn.
  const lift = 22 + 10 * Math.sin(TAU * t);
  place(-lift + 30, 0.78, 0);
  shadow(lift, 440);
  add(front, 'rect', { x: 286, y: 40, width: 190, height: 96, rx: 48, fill: '#2b2e36', stroke: '#3c404b', 'stroke-width': 3 });
  add(front, 'circle', { cx: 290, cy: 156, r: 14, fill: '#2b2e36', stroke: '#3c404b', 'stroke-width': 3 });
  add(front, 'circle', { cx: 268, cy: 184, r: 8, fill: '#2b2e36', stroke: '#3c404b', 'stroke-width': 3 });
  const colors = ['#4285f4', '#ea4335', '#f4b400'];
  for (let i = 0; i < 3; i++) {
    const phase = (t * 3 - i + 3) % 3; // each dot peaks in its own third of the loop
    const p = phase < 1 ? Math.sin(Math.PI * phase) : 0;
    add(front, 'circle', { cx: 336 + i * 45, cy: 88 - 12 * p, r: 13 + 5 * p, fill: colors[i], opacity: 0.45 + 0.55 * p });
  }
}

if (state === 'type') {
  // You're editing: small hovering logo above a code card that types itself.
  const lift = 10 + 6 * Math.sin(TAU * t);
  place(-120 - lift, 0.5);
  add(back, 'rect', { x: 66, y: 236, width: 380, height: 220, rx: 22, fill: '#22252c', stroke: '#343842', 'stroke-width': 3 });
  for (let i = 0; i < 3; i++) add(back, 'circle', { cx: 96 + i * 22, cy: 262, r: 6, fill: ['#ea4335', '#f4b400', '#34a853'][i] });
  const lines = [[0, 180, '#c678dd'], [28, 230, '#61afef'], [28, 150, '#98c379'], [0, 120, '#e5c07b']];
  const total = lines.reduce((n, l) => n + l[1], 0);
  let budget = total * Math.min(1, t * 1.25); // typed so far; holds the last 20% of the loop
  let caret = null;
  lines.forEach(([indent, len, color], i) => {
    const w = Math.max(0, Math.min(len, budget));
    budget -= len;
    const x = 96 + indent, y = 296 + i * 38;
    if (w > 0) add(back, 'rect', { x, y, width: w, height: 16, rx: 8, fill: color, opacity: 0.9 });
    if (!caret && (budget < 0 || i === lines.length - 1)) caret = [x + w + 6, y - 4];
  });
  if (Math.floor(t * 4) % 2 === 0 || t < 0.8) add(back, 'rect', { x: caret[0], y: caret[1], width: 5, height: 24, rx: 2, fill: '#e6e6e6' });
}

if (state === 'sleep') {
  // Idle: gravity wins. The logo rests on the ground, dimmed, breathing slowly, with rising Zs.
  const breathe = 1 + 0.025 * Math.sin(TAU * t);
  place(70, 0.78 * breathe, -8, 0.5);
  add(back, 'ellipse', { cx: 256, cy: 432, rx: 125, ry: 15, fill: '#000', opacity: 0.5 });
  for (let i = 0; i < 3; i++) {
    const p = (t + i / 3) % 1;
    add(front, 'text', {
      x: 330 + 70 * p, y: 210 - 150 * p, fill: '#9aa0a6', opacity: Math.sin(Math.PI * p).toFixed(3),
      'font-family': 'Segoe UI, Arial, sans-serif', 'font-weight': 700, 'font-size': 34 + 30 * p,
    }, 'z');
  }
}
</script>
</body>
</html>
